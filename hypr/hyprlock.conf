# BACKGROUND
background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(255, 255, 255, 0.98)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(200, 205, 215, 0.85)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
}

# GLASS CARD (Main background card for login controls)
shape {
    monitor =
    size = 360, 180
    color = rgba(18, 20, 26, 0.60)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 255, 255, 0.16)
    rotate = 0
    xray = false
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# USER-BOX
shape {
    monitor =
    size = 310, 48
    color = rgba(255, 255, 255, 0.05)
    rounding = 14
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    rotate = 0
    xray = false
    position = 0, -30
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =    $USER
    color = rgba(245, 245, 250, 0.95)
    outline_thickness = 0
    font_size = 15
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, -30
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 310, 48
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(12, 14, 18, 0.65)
    font_color = rgb(240, 242, 245)
    check_color = rgba(137, 180, 250, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff55">  Enter Pass</span></i>
    fail_text = <i><span>$FAIL ($ATTEMPTS)</span></i>
    hide_input = false
    rounding = 14
    position = 0, -100
    halign = center
    valign = center
}
