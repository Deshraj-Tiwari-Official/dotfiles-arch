set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:clipboard:extkeys"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:kitty"
set -g allow-passthrough on
set -s set-clipboard on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s escape-time 0
set -g history-limit 50000
set -g display-time 2000
set -g focus-events on
setw -g aggressive-resize on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy || xclip -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel

bind v copy-mode

bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind b break-pane -d
bind J choose-window "join-pane -h -s '%%'"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind S setw synchronize-panes \; display-message "Sync panes: #{?pane_synchronized,ON,OFF}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded 󰑓"

set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=#000000,fg=colour245"
set -g status-left-length 50
set -g status-left "  #[fg=colour250,bold] #S#[fg=colour245,bg=#000000] #{?client_prefix,#[fg=colour252,bold] 󰘳 PREFIX #[fg=colour245,bg=#000000] ,}#[fg=colour240]│#[fg=colour245,bg=#000000] "
set -g status-right-length 100
set -g status-right "#{?pane_synchronized,#[fg=colour252]  SYNC #[fg=colour245,bg=#000000] ,}#{?window_zoomed_flag,#[fg=colour252] 󰁌 ZOOM #[fg=colour245,bg=#000000] ,}#[fg=colour242] #{b:pane_current_path} #[fg=colour238]•#[fg=colour242] %H:%M#[fg=colour245,bg=#000000]   "
set -g window-status-separator " "
set -g window-status-format "#[fg=colour240,bg=#000000] #I:#W #[fg=colour245,bg=#000000]"
set -g window-status-current-format "#[fg=colour252,bg=#000000,bold] #I:#W #[fg=colour245,bg=#000000]"
set -g pane-border-lines single
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour244"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @continuum-restore 'on'

set -g @fzf-url-bind 'u'

run '~/.tmux/plugins/tpm/tpm'
